baseURL = '/'
locale = 'en-us'
title = 'Ol Chiki  AI'
theme = 'PaperMod'

[markup.goldmark.renderer]
unsafe = true

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 3
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 4

[params]
  env = 'production'
  defaultTheme = 'auto'
  profileMode.enabled = false

  [params.assets]
    customHead = '''
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Ol+Chiki&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Merriweather Sans', 'Noto Sans Ol Chiki', sans-serif !important;
            font-size: 17px;
            line-height: 1.75;
        }
        .post-content, .post-content p, .post-content li, .page-header, .main {
            font-family: 'Merriweather Sans', 'Noto Sans Ol Chiki', sans-serif !important;
        }
        code, pre {
            font-family: 'JetBrains Mono', 'Fira Code', monospace !important;
        }
        .post-content h1:first-child,
        .page-header h1,
        h1.post-title {
            font-weight: 400 !important;
            font-size: 1.4rem !important;
        }
    </style>
    '''